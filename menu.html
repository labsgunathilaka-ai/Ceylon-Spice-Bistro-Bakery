<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ceylon Spice Bistro | Culinary Offerings</title>
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <a href="home.html" class="nav-brand">Ceylon <span>Spice</span></a>
            <ul class="nav-links">
                <li><a href="home.html">Home</a></li>
                <li><a href="menu.html">Menu</a></li>
                <li><a href="service.html">Services</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
            <div class="nav-auth-buttons" id="nav-auth-container">
                <a href="login.html" class="btn btn-outline">Login</a>
                <a href="login.html" class="btn btn-primary">Signup</a>
            </div>
        </div>
    </nav>

    <main class="container">
        <h2>Culinary Offerings</h2>
        <div style="display: flex; gap: 30px; margin-top: 20px;">
            <aside style="width: 250px; background: #fff; padding: 20px; border-radius: 8px; height: fit-content;">
                <h4>Filter Options</h4>
                <div style="margin-top: 15px;">
                    <p style="font-weight: 600; font-size: 0.9rem;">Category</p>
                    <button onclick="filterMenu('all')" class="btn btn-outline" style="width: 100%; color: #000; margin-top: 5px; text-align: left;">All Categories</button>
                    <button onclick="filterMenu('Mains')" class="btn btn-outline" style="width: 100%; color: #000; margin-top: 5px; text-align: left;">Mains</button>
                    <button onclick="filterMenu('Desserts')" class="btn btn-outline" style="width: 100%; color: #000; margin-top: 5px; text-align: left;">Desserts</button>
                    <button onclick="filterMenu('Drinks')" class="btn btn-outline" style="width: 100%; color: #000; margin-top: 5px; text-align: left;">Drinks</button>
                </div>
            </aside>

            <section style="flex: 1;">
                 <!-- Search Bar -->
                <input type="text" id="searchBar" onkeyup="searchMenu()" placeholder="Search food items..." style="width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; margin-bottom: 20px;">
    
    
               <div id="foodGrid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 20px;"></div>
           </section>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Ceylon Spice Bistro. Address: No. 45, Galle Road, Colombo 03.</p>
            <div class="social-icons">
                <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
                <a href="#" aria-label="LinkedIn"><i class="fa-brands fa-linkedin-in"></i></a>
                <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            </div>
        </div>
    </footer>

    <script src="js/main.js"></script>
    <script src="js/menu.js"></script>
</body>
</html>
